[workspace]
members = ["crates/capsx-core", "crates/capsx-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["CapsX Contributors"]
repository = "https://github.com/ihuadz/capsx"

[workspace.dependencies]
anyhow = "1.0"
directories = "5.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
